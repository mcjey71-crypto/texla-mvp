name: Publish collaboration server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'shared/collaboration.ts'
      - 'shared/voice.ts'
      - 'wrangler.jsonc'
      - 'scripts/check-collaboration-service.mjs'
      - '.github/workflows/collaboration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collaboration-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run collab:check
      - run: npm test
      - name: Verify collaboration and walkie-talkie in browsers
        timeout-minutes: 8
        run: |
          texla_browser="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$texla_browser" ]; then
            npx playwright install --with-deps chromium
            texla_browser="$(node -p "require('playwright').chromium.executablePath()")"
          fi
          CHROMIUM_PATH="$texla_browser" npm run test:collaboration -- --reporter=line,github
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_SEND_METRICS: 'false'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'Configura CLOUDFLARE_API_TOKEN como secret y CLOUDFLARE_ACCOUNT_ID como variable. Consulta docs/collaboration.md.'
            exit 1
          fi
          set -o pipefail
          npm run collab:deploy | tee "$RUNNER_TEMP/texla-worker-deploy.log"
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const log=readFileSync(process.env.RUNNER_TEMP+'/texla-worker-deploy.log','utf8');
          const url=log.match(/https:\/\/texla-collaboration\.[a-z0-9-]+\.workers\.dev\b/);
          if(url)console.log('::notice::Collaboration Worker published at '+url[0]);
          JS
      - name: Verify published walkie-talkie support
        env:
          VITE_COLLABORATION_URL: ${{ vars.VITE_COLLABORATION_URL || 'https://texla-collaboration.mcjey71.workers.dev' }}
          REQUIRE_VOICE: '1'
        run: |
          for attempt in 1 2 3; do
            if node scripts/check-collaboration-service.mjs; then exit 0; fi
            sleep 5
          done
          exit 1
