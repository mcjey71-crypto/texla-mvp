name: Publish collaboration server

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collaboration-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run collab:check
      - run: npm test
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_SEND_METRICS: 'false'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'Configura CLOUDFLARE_API_TOKEN como secret y CLOUDFLARE_ACCOUNT_ID como variable. Consulta docs/collaboration.md.'
            exit 1
          fi
          npm run collab:deploy
